[build-system]
requires = ["setuptools>=61.0", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentknock"
version = "0.3.1"
description = "Attach to an already-running, unmodifiable Windows console AI agent and knock it awake — focus-free, by PID, via CONIN$. The attach-to-existing half of desktop multi-agent orchestration."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ibusa-T" }]
keywords = [
    "agent",
    "cli-agent",
    "multi-agent",
    "orchestration",
    "console",
    "conin",
    "windows",
    "wake",
    "transport",
    "antigravity",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Cython",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Shells",
]

[project.urls]
Homepage = "https://github.com/Ibusa-T/agentknock"
Repository = "https://github.com/Ibusa-T/agentknock"

# OS ネイティブ FS 通知 (watchdog) は任意。未導入時は core 同梱の PollingNotifier に自動フォールバック (B6)。
[project.optional-dependencies]
watch = ["watchdog>=4.0.0"]

# agentknock (v0.3) は公開パッケージ agentknock/ (core/ adapters/ を含む) を配布する。
# v0.2 互換のため従来のフラットモジュール (console_injector 等) も py-modules として併置する。
# 同ディレクトリの agent_tools.py 等の無関係なファイルはパッケージに含めない。
[tool.setuptools]
packages = ["agentknock", "agentknock.core", "agentknock.adapters"]
py-modules = ["console_injector", "_contract", "_registry", "_watcher"]

# ネイティブ拡張 (_win_console) のビルドは setup.py (cythonize / zig) が担う。
# MSVC がある環境:  uv run python setup.py build_ext --inplace
# MSVC が無い環境:  uv run --with ziglang python setup.py --zig
